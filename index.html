<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>משימות צוות</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="משימות">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f4e79">
<style>
  :root {
    --bg: #f4f2ed; --card: #ffffff; --text: #1d2125; --muted: #5f6770; --line: #e2ded5;
    --brand: #1f4e79; --brand-text: #ffffff; --brand-soft: #e3edf7;
    --ok: #1e7d3a; --ok-bg: #e5f4e9; --bad: #b3261e; --bad-bg: #fbe9e7; --warn: #9a5800; --warn-bg: #fff1dc;
    --p-high: #d93025; --p-normal: #e3a900; --p-low: #aab0b6;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 2px 8px rgba(0,0,0,.05);
    --overlay: rgba(10, 20, 30, .42);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --card: #1f2329; --text: #eceff1; --muted: #a3abb4; --line: #333a42;
      --brand: #6aa6e0; --brand-text: #0d1b29; --brand-soft: #1d2f42;
      --ok: #7fd49a; --ok-bg: #1d3325; --bad: #ff9a8f; --bad-bg: #3a201d; --warn: #f0c46a; --warn-bg: #36301a;
      --p-high: #ff7b6e; --p-normal: #f0c040; --p-low: #6c747c;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
      --overlay: rgba(0, 0, 0, .6);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    min-height: 100vh;
  }
  body.noscroll { overflow: hidden; }
  button { font: inherit; color: inherit; }
  .hidden { display: none !important; }

  /* ---------- כותרת ולשוניות ---------- */
  .topbar { position: sticky; top: 0; z-index: 5; }
  .top {
    background: var(--brand); color: var(--brand-text);
    padding: max(10px, env(safe-area-inset-top)) 12px 10px 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .top .brandname { font-size: 20px; font-weight: 700; }
  .top .who { font-size: 15px; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .grow { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
  .sync { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; border: 0; cursor: pointer; white-space: nowrap; }
  .sync.saving { background: rgba(255,255,255,.2); color: inherit; }
  .sync.offline { background: var(--warn-bg); color: var(--warn); }
  .sync.nonet { background: rgba(255,255,255,.2); color: inherit; }
  .icon-btn {
    background: transparent; border: 0; color: inherit; font-size: 22px; min-width: 44px; min-height: 44px;
    border-radius: 12px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
  }
  .tabs { display: flex; gap: 6px; padding: 8px 12px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .tab {
    flex: 1; border: 0; background: transparent; color: var(--muted); font-weight: 700; font-size: 16px;
    padding: 9px 6px; border-radius: 12px; cursor: pointer; min-height: 44px;
  }
  .tab.on { background: var(--card); color: var(--brand); box-shadow: var(--shadow); }
  .tab .count {
    display: inline-block; min-width: 22px; padding: 0 6px; margin-inline-start: 6px; border-radius: 999px;
    background: var(--brand-soft); color: var(--brand); font-size: 13px; line-height: 22px;
  }
  .banner { background: var(--warn-bg); color: var(--warn); padding: 10px 16px; font-weight: 700; text-align: center; cursor: pointer; }

  /* ---------- רשימות ---------- */
  main { max-width: 720px; margin: 0 auto; padding: 4px 12px calc(120px + env(safe-area-inset-bottom)); }
  .sec { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 4px 8px; font-weight: 700; color: var(--muted); font-size: 15px; }
  .hint { font-weight: 400; font-size: 13px; }
  .link-btn { background: none; border: 0; color: var(--brand); font-weight: 700; cursor: pointer; padding: 8px 6px; font-size: 15px; }
  .list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .task {
    position: relative; display: flex; align-items: center; gap: 4px;
    background: var(--card); border-radius: 14px; padding: 8px 6px 8px 4px; box-shadow: var(--shadow);
    border-inline-start: 5px solid var(--p-normal); cursor: pointer; min-height: 62px;
  }
  .task.p-high { border-inline-start-color: var(--p-high); }
  .task.p-low { border-inline-start-color: var(--p-low); }
  .task.is-done, .task.is-cancelled { border-inline-start-color: var(--line); }
  .check { flex: none; width: 46px; height: 46px; border: 0; background: transparent; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .check .ring {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--muted); display: flex;
    align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: #fff;
  }
  .check:hover .ring { border-color: var(--ok); }
  .task.is-done .ring { background: var(--ok); border-color: var(--ok); }
  .task.is-cancelled .ring { border-style: dashed; }
  .body { flex: 1; min-width: 0; padding: 2px 0; }
  .ttl { font-weight: 600; overflow-wrap: anywhere; }
  .task.is-done .ttl, .task.is-cancelled .ttl { text-decoration: line-through; color: var(--muted); font-weight: 500; }
  .meta { display: flex; flex-wrap: wrap; gap: 2px 10px; margin-top: 2px; font-size: 14px; color: var(--muted); }
  .chip { white-space: nowrap; }
  .chip.urgent { color: var(--p-high); font-weight: 700; }
  .chip.late { color: var(--bad); font-weight: 700; }
  .chip.today { color: var(--brand); font-weight: 700; }
  .chip.okc { color: var(--ok); }
  .chip.pend { color: var(--warn); font-weight: 700; }
  .age-orange { color: var(--warn); font-weight: 600; }
  .age-red { color: var(--bad); font-weight: 600; }
  .handle {
    flex: none; width: 42px; height: 46px; border: 0; background: transparent; color: var(--muted);
    font-size: 24px; cursor: grab; touch-action: none; display: flex; align-items: center; justify-content: center;
  }
  .task.dragging { z-index: 3; box-shadow: 0 10px 28px rgba(0,0,0,.22); }
  .list.drag-on .task:not(.dragging) { transition: transform .15s ease; }
  .empty { text-align: center; color: var(--muted); padding: 36px 16px; }
  .empty .big { font-size: 40px; }

  /* ---------- צוות ---------- */
  .people { display: flex; flex-direction: column; gap: 8px; }
  .person {
    display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 14px;
    padding: 12px 14px; box-shadow: var(--shadow); cursor: pointer; border: 0; width: 100%; text-align: start;
  }
  .person.off { opacity: .55; }
  .avatar {
    flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--brand-soft); color: var(--brand);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px;
  }
  .person .grow { flex: 1; min-width: 0; }
  .pname, .stats, .pstatus { display: block; }
  .pname { font-weight: 700; }
  .role { font-size: 12px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border-radius: 999px; padding: 1px 8px; margin-inline-start: 8px; }
  .stats { font-size: 14px; color: var(--muted); }
  .pstatus { font-size: 14px; color: var(--warn); font-weight: 600; }
  .chev { color: var(--muted); font-size: 22px; }

  /* ---------- כפתור הוספה ---------- */
  .fab {
    position: fixed; inset-inline-end: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 6;
    width: 62px; height: 62px; border-radius: 50%; border: 0; background: var(--brand); color: var(--brand-text);
    font-size: 36px; line-height: 1; box-shadow: 0 6px 18px rgba(0,0,0,.25); cursor: pointer;
  }

  /* ---------- חלון (גיליון תחתון) ---------- */
  .sheet-wrap { position: fixed; inset: 0; background: var(--overlay); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
  .sheet {
    background: var(--card); width: 100%; max-width: 640px; max-height: 92%; overflow: auto; overscroll-behavior: contain;
    border-radius: 20px 20px 0 0; padding: 14px 16px calc(22px + env(safe-area-inset-bottom));
  }
  @media (min-width: 700px) {
    .sheet-wrap { align-items: flex-start; padding-top: 6vh; }
    .sheet { border-radius: 20px; max-height: 92%; padding-bottom: 22px; }
  }
  .sheet-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 6px; }
  .sheet-head h2 { flex: 1; margin: 8px 0 0; font-size: 20px; overflow-wrap: anywhere; }
  .sheet-head .icon-btn { color: var(--muted); margin-inline-end: -8px; }
  .field { margin: 14px 0; }
  .lbl { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; font-weight: 700; }
  input[type=text], input[type=tel], input[type=date], select, textarea {
    font: inherit; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); min-height: 48px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: transparent; }
  input.err { outline: 2px solid var(--bad); }
  textarea { min-height: 84px; resize: vertical; }
  .title-input { font-size: 19px; font-weight: 600; }
  textarea.title-input { min-height: 48px; resize: none; overflow: hidden; line-height: 1.35; display: block; }
  .ltr { direction: ltr; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt {
    border: 1.5px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 7px 14px; font-size: 16px; min-height: 42px; cursor: pointer;
  }
  .opt.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 700; }
  .btn {
    font-weight: 700; border: 0; border-radius: 12px; padding: 12px 16px; min-height: 50px; cursor: pointer;
    background: var(--brand); color: var(--brand-text); display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; text-decoration: none; font-size: 17px;
  }
  .btn.secondary { background: transparent; color: var(--brand); border: 2px solid var(--brand); }
  .btn.danger { background: transparent; color: var(--bad); border: 2px solid var(--bad-bg); }
  .btn.ok { background: var(--ok); color: #fff; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.block { width: 100%; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .actions > * { flex: 1 1 140px; }
  .info { margin: 8px 0; }
  .info .k { color: var(--muted); }
  .status-line { font-weight: 700; margin: 4px 0 10px; }
  .note-box { background: var(--bg); border-radius: 12px; padding: 10px 12px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 10px 0; }
  .box { background: var(--bg); border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
  .box h3 { margin: 0 0 6px; font-size: 16px; }
  .box p { margin: 4px 0; }
  .steps { margin: 6px 0; padding-inline-start: 22px; }
  .steps li { margin: 4px 0; }
  .msg { margin: 10px 0; padding: 10px 12px; border-radius: 12px; font-weight: 600; }
  .msg.bad { background: var(--bad-bg); color: var(--bad); }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .code-big { font-size: 40px; font-weight: 800; letter-spacing: 6px; text-align: center; direction: ltr; margin: 10px 0; color: var(--brand); }
  .pre { white-space: pre-wrap; background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 15px; overflow-wrap: anywhere; }
  .small { font-size: 14px; color: var(--muted); }
  .sub-list { margin-top: 8px; }
  .danger-link { background: none; border: 0; color: var(--bad); font-weight: 600; cursor: pointer; padding: 10px 0; margin-top: 8px; }

  /* ---------- כניסה ---------- */
  .login { max-width: 460px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 20px 40px; }
  .login .logo { width: 76px; height: 76px; border-radius: 20px; display: block; margin: 8px auto 12px; }
  .login h1 { text-align: center; font-size: 24px; margin: 0 0 4px; }
  .login .lead { text-align: center; color: var(--muted); margin: 0 0 18px; }
  .code-input { font-size: 30px !important; letter-spacing: 10px; text-align: center; direction: ltr; font-weight: 700; }
  .pin-input { font-size: 30px !important; letter-spacing: 14px; text-align: center; direction: ltr; -webkit-text-security: disc; }
  .center { text-align: center; }

  /* ---------- הודעה קופצת ---------- */
  .toast {
    position: fixed; bottom: calc(94px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    background: #22272e; color: #fff; border-radius: 12px; padding: 10px 16px; display: flex; gap: 16px;
    align-items: center; z-index: 30; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.3); font-weight: 600;
  }
  .toast button { background: none; border: 0; color: #8cc4ff; font-weight: 800; cursor: pointer; padding: 6px 2px; white-space: nowrap; }

  /* ---------- היום שלי ---------- */
  .today-card { background: var(--card); border-radius: 14px; padding: 12px 14px; margin: 12px 0 4px; box-shadow: var(--shadow); }
  .today-date { font-weight: 700; color: var(--brand); font-size: 15px; }
  .quote { margin: 8px 0 4px; font-size: 16px; }
  .quote .qt { font-style: italic; }
  .quote .qs { color: var(--muted); font-size: 13px; }
  .meet { margin: 8px 0 2px; border-top: 1px solid var(--line); padding-top: 8px; }
  .meet-h { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .meet-row { font-size: 15px; margin: 2px 0; }
  .meet-row .mt { font-weight: 700; color: var(--brand); direction: ltr; unicode-bidi: isolate; }
  .cheer { margin-top: 8px; font-size: 15px; color: var(--ok); font-weight: 600; }
  .push-card { background: var(--brand-soft); }
  .team-sum { margin: 4px 4px 10px; color: var(--ok); font-weight: 600; font-size: 15px; }

  /* ---------- עדכונים ---------- */
  .updates { margin-top: 6px; }
  .upd {
    display: block; width: 100%; text-align: start; border: 0; background: var(--card); border-radius: 12px; padding: 9px 12px;
    margin-bottom: 6px; box-shadow: var(--shadow); cursor: pointer; border-inline-start: 4px solid var(--brand);
  }
  .upd.nudge { border-inline-start-color: var(--warn); }
  .upd-text { display: block; font-weight: 600; overflow-wrap: anywhere; }
  .upd-sub { display: block; font-size: 13px; color: var(--muted); }

  /* ---------- קבוצות דחיפות ---------- */
  .grp-h { font-weight: 700; font-size: 15px; margin: 12px 4px 6px; }
  .grp-h.grp-high { color: var(--p-high); }
  .grp-h.grp-low { color: var(--muted); }
  .grp-h.grp-today { color: var(--brand); }
  .pdot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-inline-end: 7px; vertical-align: 1px; background: var(--p-normal); flex: none; }
  .pdot.p-high { background: var(--p-high); }
  .pdot.p-low { background: transparent; border: 2px solid var(--p-low); }
  .task.is-done .pdot, .task.is-cancelled .pdot { opacity: .4; }
  .future-btn {
    display: flex; justify-content: space-between; align-items: center; width: 100%; margin: 18px 0 8px; padding: 12px 14px;
    border: 1.5px dashed var(--line); border-radius: 14px; background: transparent; color: var(--muted); font-weight: 700; font-size: 15px; cursor: pointer;
  }
  .future-btn .chev { font-size: 16px; }
  ul[data-list=future] .task { opacity: .85; }
  /* משימה שבוצעה: מחליקים הצידה כדי להסיר מהמסך (גלילה למעלה/למטה נשארת רגילה) */
  .task.swipe { touch-action: pan-y; -webkit-user-select: none; user-select: none; }
  .task.swiping { position: relative; z-index: 2; box-shadow: 0 6px 18px rgba(0,0,0,.15); cursor: grabbing; }
  .swipe-tip { text-align: center; color: var(--muted); margin: 6px 0 0; }
  /* כרטיס שמוחלק לא יגרום לכל המסך לזוז הצידה */
  ul[data-list=done] { overflow-x: hidden; padding-block: 4px; margin-block: -4px; }
  @supports (overflow-x: clip) { ul[data-list=done] { overflow-x: clip; padding-block: 0; margin-block: 0; } }
  .chip.remind { color: var(--brand); }
  .chip.newc { color: var(--brand); font-weight: 800; }
  .card-acts { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .btn.small-btn { min-height: 40px; padding: 6px 12px; font-size: 15px; border-radius: 10px; }
  .btn.small-btn.secondary { border-width: 1.5px; }

  /* ---------- חלון עריכה ---------- */
  .extras { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
  .extras .opt { font-size: 15px; padding: 6px 12px; min-height: 40px; }
  .two { display: flex; gap: 8px; margin-top: 8px; }
  .two > * { flex: 1; min-width: 0; }
  input[type=time], input[type=email] {
    font: inherit; width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); min-height: 48px;
  }
  .repeat-params { margin-top: 8px; }
  .remind-pick { margin-top: 10px; padding: 10px 12px; background: var(--bg); border-radius: 12px; }
  .remind-pick .opt { background: var(--card); }
  .time-pick { display: flex; align-items: center; gap: 8px; direction: ltr; justify-content: flex-end; }
  .time-pick select { width: 92px; font-size: 22px; font-weight: 700; text-align: center; text-align-last: center; padding: 8px; background: var(--card); }
  .time-pick select:disabled { opacity: .45; }
  .time-pick .colon { font-size: 24px; font-weight: 800; }
  .remind-sum { margin: 10px 0 0; font-weight: 700; color: var(--brand); }
  .remind-sum.bad { color: var(--bad); }
  .paste-btn { margin-top: -8px; padding-inline-start: 0; }
  .attach { display: flex; gap: 8px; margin: 10px 0; }
  .files { display: flex; flex-wrap: wrap; gap: 10px; }
  .file { background: var(--bg); border-radius: 12px; padding: 8px; flex: 1 1 100%; min-width: 0; }
  .file.img { flex: 0 1 calc(50% - 5px); }
  .file .thumb { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; display: block; cursor: zoom-in; background: var(--line); min-height: 60px; }
  .file audio { width: 100%; margin-top: 4px; }
  .file .fname { font-weight: 600; overflow-wrap: anywhere; }
  .del-file { color: var(--bad); padding: 4px 0; font-size: 14px; }
  .full-img { width: 100%; border-radius: 10px; }
  .sheet.drop { outline: 3px dashed var(--brand); outline-offset: -6px; }
  .rec-out { margin: 8px 0 12px; font-weight: 600; }
  .rec-btn.recording { background: var(--bad); color: #fff; }

  /* ---------- תגובות ---------- */
  .comments { margin-top: 6px; }
  .cmt { background: var(--bg); border-radius: 12px; padding: 7px 11px; margin: 6px 0; max-width: 92%; }
  .cmt.mine { background: var(--brand-soft); margin-inline-start: auto; }
  .cmt.nudge { background: var(--warn-bg); }
  .cmt.system { background: transparent; color: var(--muted); font-size: 14px; padding: 2px 4px; max-width: 100%; }
  .cmt-h { font-size: 12px; color: var(--muted); }
  .cmt-t { white-space: pre-wrap; overflow-wrap: anywhere; }
  .cmt.system .cmt-t { display: inline; }
  .cmt.system .cmt-h { display: inline; margin-inline-end: 6px; }
  .cmt-new { display: flex; gap: 8px; align-items: flex-end; margin-top: 8px; }
  .cmt-new textarea { min-height: 46px; resize: none; flex: 1; }

  /* ---------- היסטוריה, הגדרות ---------- */
  .search-wrap { position: relative; margin: 10px 0 4px; }
  .search-wrap input { background: var(--card); min-height: 44px; padding-block: 9px; padding-inline-end: 44px; }
  .search-clear {
    position: absolute; inset-inline-end: 4px; top: 50%; transform: translateY(-50%); width: 38px; height: 38px;
    border: 0; background: transparent; color: var(--muted); font-size: 18px; cursor: pointer; border-radius: 10px;
  }
  .search-note { text-align: center; color: var(--muted); font-size: 14px; margin: 12px 0 0; }
  /* משימה אישית, ושליחה לכמה עובדים */
  .chip.pers { color: var(--muted); font-weight: 700; }
  .pers-hint { margin: 4px 2px 0; }
  .multi-box { border: 1px solid var(--line); border-radius: 12px; padding: 6px 10px; margin-top: 8px; background: var(--card); }
  .multi-acts { display: flex; gap: 14px; justify-content: flex-start; margin-bottom: 2px; }
  .multi-list { max-height: 220px; overflow-y: auto; }
  /* משימה שנפתחה מהתראה: מה התעדכן */
  .notif-note { background: var(--card); border: 2px solid var(--brand); color: var(--text); border-radius: 12px; padding: 10px 12px; margin: 4px 0 10px; font-weight: 700; }
  /* "נתתי": מיון לפי מצב / לפי עובד */
  .given-sort { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 4px 0; }
  .given-sort .lbl { margin: 0; color: var(--muted); font-weight: 700; }
  .given-sort .chips { margin: 0; }
  .grp-h.grp-user { color: var(--brand); }
  /* פרטי עובד: הפרטים והפעולות בסוף הדף */
  .user-details { margin-top: 20px; }
  /* לשונית עובד בלי אפליקציה */
  .worker-head { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 12px 14px; margin: 10px 0 4px; }
  .worker-head .wh-title { font-size: 18px; font-weight: 800; margin-bottom: 2px; }
  .worker-head .actions { margin-top: 10px; }
  .tabs .tab { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tabs.many { gap: 3px; padding-inline: 6px; }
  .tabs.many .tab { font-size: 13.5px; padding: 9px 2px; }
  .tabs.many .tab .count { margin-inline-start: 2px; padding: 0 4px; min-width: 16px; }
  .hist-bar { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .hist-bar input { flex: 2 1 200px; }
  .hist-bar select { flex: 1 1 120px; }
  .check-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; cursor: pointer; }
  .check-row input, .q-text input { width: 22px; height: 22px; flex: none; }
  .ok-text { color: var(--ok); font-weight: 700; }
  .muted-role { color: var(--muted); background: var(--bg); }
  .q-row { display: flex; align-items: flex-start; gap: 6px; border-bottom: 1px solid var(--line); padding: 6px 0; }
  .q-row.off { opacity: .55; }
  .q-text { flex: 1; display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .small-x { min-width: 36px; min-height: 36px; font-size: 16px; color: var(--muted); }
  .tab { font-size: 15px; padding: 9px 4px; }
  @media (max-width: 380px) { .tab { font-size: 14px; } .tab .count { margin-inline-start: 3px; padding: 0 4px; min-width: 18px; } }
</style>
</head>
<body>

<div id="app" class="hidden">
  <div class="topbar">
    <header class="top">
      <div class="grow"><span class="brandname">משימות</span><span id="who" class="who"></span></div>
      <button id="syncState" class="sync hidden" type="button"></button>
      <button id="btnSettings" class="icon-btn" type="button" aria-label="הגדרות">⚙</button>
    </header>
    <div id="banner" class="banner hidden"></div>
    <nav id="tabs" class="tabs" role="tablist"></nav>
  </div>
  <main>
    <!-- חיפוש ב"שלי" / "נתתי" / "צוות": מחוץ ל-#view כדי שהמקלדת לא תיסגר כשהרשימה מתעדכנת -->
    <div id="searchWrap" class="search-wrap hidden" role="search">
      <input id="listQ" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" placeholder="🔍 חיפוש משימה" aria-label="חיפוש משימה">
      <button id="listQx" class="search-clear hidden" type="button" aria-label="ניקוי החיפוש">✕</button>
    </div>
    <div id="view"></div>
  </main>
  <button id="fab" class="fab" type="button" aria-label="משימה חדשה">+</button>
</div>

<div id="login" class="login hidden"></div>

<div id="sheetWrap" class="sheet-wrap hidden">
  <div id="sheetBox" class="sheet" role="dialog" aria-modal="true"><div id="sheet"></div></div>
</div>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
